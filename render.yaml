services:
  - type: web
    name: hackelite-shared
    runtime: docker
    region: singapore
    plan: free
    healthCheckPath: /api/health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: SERVE_CLIENT
        value: "true"
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: PRO_ACTIVATION_KEYS
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: PLANS_ENABLED
        value: "false"
      # Required in production: password resets, email verification and admin alerts
      - key: SMTP_URL
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
